<section class="panel"><h2>Materias disponibles</h2><p>Estas opciones pueden asignarse a los estudiantes.</p><div class="crear"><label>Nueva materia<input name="materia" [ngModel]="nuevaMateria()" (ngModelChange)="nuevaMateria.set($event)" placeholder="Ej. Cálculo I" (keyup.enter)="crear()" /></label><button (click)="crear()" [disabled]="guardando() || !nuevaMateria().trim()">{{ guardando() ? 'Guardando...' : 'Guardar materia' }}</button></div>@if (mensaje()) { <p class="exito">{{ mensaje() }}</p> } @if (error()) { <p class="error">{{ error() }}</p> }<div class="lista">@for (materia of materias(); track materia) { <span>{{ materia }}</span> }</div></section>
